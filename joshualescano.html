<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Joshua Lescano — Creative Content Specialist</title>
  <meta name="description" content="Joshua Lescano — Creative Content Specialist and Founder of Iconiq Creatives. Social Media Manager, Graphic Designer, Video Editor.">
  <link rel="canonical" href="https://iconiqcreatives.com/joshualescano">
  <meta name="theme-color" content="#05060a">

  <!-- Favicon — Joshua's profile picture -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/joshualescano/favicon-32.png?v=1">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/images/joshualescano/favicon-48.png?v=1">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/joshualescano/favicon-192.png?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/joshualescano/favicon-180.png?v=1">

  <!-- Open Graph (link previews) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Iconiq Creatives">
  <meta property="og:title" content="Joshua Lescano — Creative Content Specialist">
  <meta property="og:description" content="Founder of Iconiq Creatives · Social Media Manager, Graphic Designer, Video Editor.">
  <meta property="og:url" content="https://iconiqcreatives.com/joshualescano">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #05060a; }
    body { overflow: hidden; }
    /* Joshua Lescano's portfolio, served full-screen under the Iconiq domain.
       Embedded so it always mirrors the live portfolio (joshualescano.vercel.app). */
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <iframe id="jl-frame"
          title="Joshua Lescano — Portfolio"
          allow="fullscreen; clipboard-write; web-share"
          referrerpolicy="no-referrer-when-downgrade"></iframe>

  <script>
    /* Deep-linking bridge: /joshualescano/<section> opens the portfolio at that
       section, and as the viewer moves through the portfolio (inside the iframe)
       the parent address bar mirrors it — so every section is shareable, like
       the main iconiqcreatives.com site. */
    (function () {
      var BASE = '/joshualescano';
      var PORTFOLIO = 'https://joshualescano.vercel.app';
      var frame = document.getElementById('jl-frame');

      /* Open the iframe at whatever section the incoming URL asked for. */
      var rest = location.pathname.slice(BASE.length).replace(/^\/+/, '');
      frame.src = PORTFOLIO + '/' + rest + location.search + location.hash;

      /* The portfolio posts its path on every change → reflect it up here. */
      window.addEventListener('message', function (e) {
        if (e.origin !== PORTFOLIO) return;
        var p = e.data && e.data.jlPath;
        if (typeof p !== 'string') return;
        var want = BASE + (p === '/' ? '' : p);
        if (location.pathname !== want) {
          try { history.replaceState(null, '', want); } catch (err) {}
        }
      });
    })();
  </script>
</body>
</html>
